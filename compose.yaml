services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: competition
      POSTGRES_USER: competition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competition -d competition"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://competition:${POSTGRES_PASSWORD}@db:5432/competition
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    mem_limit: 512m

volumes:
  postgres_data:
