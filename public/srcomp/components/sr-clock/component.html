<link rel="import" href="../../bower_components/polymer/polymer.html" />
<link rel="import" href="../sr-clock-pulse/component.html" />

<polymer-element name="sr-clock" attributes="hours minutes">
    <template>
        <style>
            h1 {
                margin: inherit;
                color: inherit;
                font-size: inherit;
            }
        </style>

        <h1>{{ hours | padTimeComponent }}:{{ minutes | padTimeComponent }}</h1>
        <sr-clock-pulse id="pulses"></sr-clock-pulse>
    </template>

    <script>
        Polymer({
            page: null,
            hours: 0,
            minutes: 0,
            ready: function() {
                this.updateTime();
                this.$.pulses.addEventListener('pulse', function(e) {
                    this.updateTime(e);
                    // Push the new text to the screen now, not on Polymer's next 125 ms dirty-check,
                    // so every screen flips on the same server second.
                    if (window.Polymer && Polymer.flush) Polymer.flush();
                }.bind(this));
            },
            updateTime: function() {
                // Server time from the clock shared with every screen.
                var date = new Date(window.ServerClock ? window.ServerClock.now() : Date.now());
                this.hours = date.getHours();
                this.minutes = date.getMinutes();
            },
            padTimeComponent: function(value) {
                if (value <= 9) {
                    return '0' + value;
                } else {
                    return '' + value;
                }
            },
        });
    </script>
</polymer-element>
