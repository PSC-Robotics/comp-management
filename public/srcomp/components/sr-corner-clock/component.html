<link rel="import" href="../../bower_components/polymer/polymer.html" />
<link rel="import" href="../sr-clock-pulse/component.html" />

<polymer-element name="sr-corner-clock" attributes="match displayOptions">
    <template>
        <style>
            h1 {
                font-family: sans-serif;
                font-size: 7em;
                color: white;
                text-align: center;
            }
        </style>

        <h1 style="background-color: {{ backgroundColor }}">{{ text }}</h1>

        <sr-clock-pulse id="pulses"></sr-clock-pulse>
    </template>

    <script>
        Polymer({
            match: undefined,
            currentGameStart: undefined,
            currentGameEnd: undefined,
            displayOptions: undefined,
            text: '',
            backgroundColor: '',
            ready: function() {
                this.updateDisplay({detail: new Date()});
                this.$.pulses.displayOptions = this.displayOptions;
                this.$.pulses.addEventListener('pulse', function(e) {
                    this.updateDisplay(e);
                    // Push the new text to the screen now, not on Polymer's next 125 ms dirty-check,
                    // so every screen flips on the same server second.
                    if (window.Polymer && Polymer.flush) Polymer.flush();
                }.bind(this));
            },
            displayOptionsChanged: function() {
                if (this.$.pulses) {
                    this.$.pulses.displayOptions = this.displayOptions;
                }
            },
            matchChanged: function() {
                if (this.match && this.match.times && this.match.times.game) {
                    this.currentGameStart = new Date(this.match.times.game.start);
                    this.currentGameEnd = new Date(this.match.times.game.end);
                } else {
                    this.currentGameStart = null;
                    this.currentGameEnd = null;
                }
            },
            pad: function(value) {
                var num = parseInt(value, 10);
                return num < 10 ? "0" + num : num.toString();
            },
            formatTimeDelta: function(delta) {
                var prefix = "";
                if (delta < 0) {
                    delta = -delta;
                    prefix = "Starting in ";
                }

                var hoursLeft = parseInt(delta / 3600, 10);
                var minutesLeft = parseInt((delta - hoursLeft * 3600) / 60, 10);
                var secondsLeft = delta - hoursLeft * 3600 - minutesLeft * 60;
                return prefix + (hoursLeft > 0 ? this.pad(hoursLeft) + ':' : '') + this.pad(minutesLeft) + ':' + this.pad(secondsLeft);
            },
            updateDisplay: function(e) {
                var clockOffsetMs = this.displayOptions && this.displayOptions.clockOffsetMs || 0;
                var currentTime = this.match && this.match.state === 'paused' && this.match.paused_at
                    ? new Date(new Date(this.match.paused_at).getTime() + clockOffsetMs)
                    : new Date(e.detail.getTime() + clockOffsetMs);
                var gameStartTime = this.currentGameStart;
                var gameEndTime = this.currentGameEnd;
                var options = this.displayOptions || {};
                this.backgroundColor = '';
                // Only a real start (or countdown) runs the match clock; a passed slot time does not.
                var started = !!(this.match && ['running', 'paused', 'awaiting_score', 'complete'].indexOf(this.match.state) !== -1);


                if (options.showEndCue && this.match && this.match.actual_end) {
                    var endedAt = new Date(this.match.actual_end);
                    var endCueMs = (options.endCueDurationSeconds || 3) * 1000;
                    if (currentTime >= endedAt && currentTime < endedAt.getTime() + endCueMs) {
                        this.text = 'END';
                        this.backgroundColor = options.endBackgroundColor || '#b3131b';
                        return;
                    }
                }

                if (options.showEndCountdown && started && gameEndTime) {
                    var endRemaining = gameEndTime - currentTime;
                    var endCountdownSeconds = options.endCountdownSeconds || 10;
                    if (endRemaining > 0 && endRemaining <= endCountdownSeconds * 1000) {
                        var endCountdown = Math.ceil(endRemaining / 1000);
                        this.text = String(endCountdown);
                        this.backgroundColor = options.flashCountdownNumbers && endCountdown % 2 === 0
                            ? options.countdownFlashColor || '#ffffff'
                            : options.countdownBackgroundColor || '#a21f24';
                        return;
                    }
                }

                if (options.showStartCue && this.match && this.match.countdown_started_at) {
                    var countdownAt = new Date(this.match.countdown_started_at);
                    var elapsed = currentTime - countdownAt;
                    if (elapsed >= 0 && elapsed < 2000) {
                        this.text = 'GET READY';
                        this.backgroundColor = options.countdownBackgroundColor || '#a21f24';
                        return;
                    }
                    if (elapsed >= 2000 && elapsed < 5000) {
                        var startCountdown = Math.ceil((5000 - elapsed) / 1000);
                        this.text = String(startCountdown);
                        this.backgroundColor = options.flashCountdownNumbers && startCountdown % 2 === 0
                            ? options.countdownFlashColor || '#ffffff'
                            : options.countdownBackgroundColor || '#a21f24';
                        return;
                    }
                    var goDurationMs = (options.cueDurationSeconds || 2) * 1000;
                    if (elapsed >= 5000 && elapsed < 5000 + goDurationMs) {
                        this.text = 'GO';
                        this.backgroundColor = options.goBackgroundColor || '#167847';
                        return;
                    }
                }

                // GO stays up for its full time after the match starts running (the server clears
                // the countdown at that moment), matching the other screens.
                if (options.showStartCue && started && this.match.state === 'running' && gameStartTime) {
                    var goSince = currentTime - gameStartTime;
                    if (goSince >= 0 && goSince < (options.cueDurationSeconds || 2) * 1000) {
                        this.text = 'GO';
                        this.backgroundColor = options.goBackgroundColor || '#167847';
                        return;
                    }
                }

                if (gameStartTime == null || gameEndTime == null) {
                    this.text = '';
                } else if (!started && currentTime >= gameStartTime) {
                    this.text = 'Waiting to start';
                } else if (currentTime >= gameEndTime) {
                    // next slot starting in 0-30 seconds
                    this.text = 'Finished';
                } else if (currentTime >= gameStartTime) {
                    // game ending in 0-180 seconds
                    var t = (gameEndTime - currentTime) / 1000;
                    this.text = this.formatTimeDelta(t);
                } else if (currentTime <= gameStartTime) {
                    // game starting in 0-90 seconds
                    var t = (gameStartTime - currentTime) / 1000;
                    this.text = this.formatTimeDelta(-t);
                }
            }
        });
    </script>
</polymer-element>
